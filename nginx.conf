server {
    listen 80;
    server_name _;

    # LLM 请求体可能较大（长上下文/多模态），放开 nginx 默认 1MB 上限避免 413
    client_max_body_size 10m;

    # 通用反代头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 流式响应：禁用缓冲，避免 SSE 被攒住
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 欢迎页
    location = / {
        proxy_pass http://llm-api-router:8000;
    }

    # 健康检查
    location = /health {
        proxy_pass http://llm-api-router:8000;
    }

    # 注册 / 登录
    location = /register {
        proxy_pass http://llm-api-router:8000;
    }
    location = /login {
        proxy_pass http://llm-api-router:8000;
    }

    # 管理后台 SPA + 静态资源（/admin, /admin/, /admin/assets/...）
    location /admin {
        proxy_pass http://llm-api-router:8000;
    }

    # 公共静态资源
    location /static/ {
        proxy_pass http://llm-api-router:8000;
    }

    # 所有 API
    location /v1/ {
        proxy_pass http://llm-api-router:8000;
    }

    # 其它一律断开连接（扫描器探测 /wp-admin /solr /boaform 等不返回任何信息）
    # 如需开放 /docs /openapi.json 调试，可在此 location 上方加白名单
    location / {
        return 444;
    }
}
