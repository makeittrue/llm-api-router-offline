version: '3.8'

services:
  llm-api-router:
    build: .
    container_name: llm-api-router
    # 不再直接暴露到宿主机，统一走 nginx 前置
    expose:
      - "8000"
    volumes:
      # 持久化数据库（用户信息、路由配置、调用日志）
      - ./data/logs.db:/app/logs.db
      # 挂载配置文件，修改配置不需要重新构建镜像
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # 时区设置，和服务器本地时间一致
      - TZ=Asia/Shanghai
      # 敏感配置从项目根目录 .env 读取（.env 已被 gitignore，不会提交到仓库）。
      # 首次部署请复制 .env.example 为 .env 并填写：
      #   LLM_ROUTER_JWT_SECRET          必填（openssl rand -hex 32）
      #   ROUTER_DATA_KEY                建议必填（openssl rand -base64 32，不可恢复）
      #   LLM_ROUTER_ACCESS_TOKEN_EXPIRE_DAYS  可选，默认 7
      #   LLM_ROUTER_ADMIN_USERNAME      可选，指定管理员用户名
      # 未设置时以下变量为空串，应用自动使用开发默认值并发出告警。
      - LLM_ROUTER_JWT_SECRET=${LLM_ROUTER_JWT_SECRET}
      - LLM_ROUTER_ACCESS_TOKEN_EXPIRE_DAYS=${LLM_ROUTER_ACCESS_TOKEN_EXPIRE_DAYS}
      - ROUTER_DATA_KEY=${ROUTER_DATA_KEY}
      - LLM_ROUTER_ADMIN_USERNAME=${LLM_ROUTER_ADMIN_USERNAME}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: llm-api-router-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llm-api-router
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
